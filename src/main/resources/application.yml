nse:
  mitch:
    replay:
      host: ${MITCH_HOST}
      port: 13496
      snapshot-port: 13496       # used when sync-mode is snapshot
      username: ${MITCH_USERNAME}
      password: ${MITCH_PASSWORD}
      market-data-group: 45      # old code had (byte) 813, which overflows to 45; confirm the intended group
      socket-timeout-ms: 10000   # read timeout; 0 = block forever
      sync-mode: replay          # replay | snapshot | none
      replay:
        start-sequence: 4
        count: 4
      snapshot:
        request-id: 5001
        instrument-id: 0
        snapshot-type: 1
